<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라이언멤버스 | 수업회차 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEBE6;--surface:#FBFAF8;--ink:#545454;--strong:#2E2E2E;--accent:#BBCBCD;--deep:#7E9598;--warn:#B15E52;--ok:#6B8F71;--review:#9A6A30;--line:#DBD9D2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--strong);display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px}.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}.brand-mark{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.4em;color:var(--deep);margin-bottom:4px}.brand-title{font-size:20px;font-weight:900;letter-spacing:-.02em}.search-wrap,.status,.results{width:100%;max-width:420px}.search-box,.phone-row{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.search-box input,.phone-row input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--strong);outline:0}.search-box input{padding:14px 16px}.search-box input::placeholder,.phone-row input::placeholder{color:#B4B1A8}.search-box button{border:0;background:var(--strong);color:#fff;padding:0 22px;border-radius:10px;font:700 15px 'Noto Sans KR',sans-serif;cursor:pointer}.phone-row{align-items:center;gap:8px;padding-left:16px;margin-top:8px}.phone-row span{font-size:13px;color:var(--ink);white-space:nowrap}.phone-row input{padding:12px 8px;letter-spacing:.05em}.status{text-align:center;font-size:13px;color:var(--ink);margin-top:10px;min-height:18px}.results{margin-top:22px;display:flex;flex-direction:column;gap:14px}.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 22px 20px;animation:rise .35s ease}.card.review{border-color:#D7C5AD}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}.card-name{font-size:19px;font-weight:900}.card-date{flex:0 0 auto;font-size:12px;color:var(--ink)}.hero-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}.hero-num{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:.85}.hero-label{font-size:13px;font-weight:700;color:var(--ink);padding-bottom:8px}.hero-num.warn{color:var(--warn)}.hero-num.ok{color:var(--strong)}.hero-num.review{font-family:'Noto Sans KR',sans-serif;font-size:27px;line-height:1.15;font-weight:900;color:var(--review)}.punch-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--deep);background:transparent}.dot.used{background:var(--deep)}.dot.half{background:linear-gradient(to right,var(--deep) 50%,transparent 50%)}.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}.meta-row b{color:var(--strong)}.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}.badge.warn{background:#F3E4E1;color:var(--warn)}.badge.ok{background:#E4EAE5;color:var(--ok)}.badge.review{background:#F1E7D9;color:var(--review)}.badge.legacy{background:#E8E7E2;color:var(--ink)}.review-note{margin-top:12px;padding:11px 12px;border-radius:10px;background:#F7F0E7;color:#71502A;font-size:12.5px;line-height:1.55}.empty{max-width:420px;text-align:center;color:var(--ink);font-size:13.5px;line-height:1.7;margin-top:30px;padding:0 12px}footer{margin-top:auto;padding-top:44px;font-size:11px;color:#A6A39A;text-align:center}
</style>
</head>
<body>
<div class="brand"><div class="brand-mark">RYAN MEMBERS</div><div class="brand-title">수업회차 조회</div></div>
<div class="search-wrap">
  <div class="search-box"><input id="nameInput" type="text" placeholder="학생 이름을 입력하세요" autocomplete="off"><button id="searchBtn" type="button">조회</button></div>
  <div class="phone-row"><span>전화번호 뒷4자리</span><input id="phoneInput" type="tel" inputmode="numeric" maxlength="4" placeholder="선택 · 동명이인 정확 조회시" autocomplete="off"></div>
  <div class="status" id="statusText" aria-live="polite"></div>
</div>
<div class="results" id="results" aria-live="polite"></div>
<footer>ⓒ Ryan Members · 데이터는 매일 갱신됩니다</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTDHzGU8F-Mg7bl0Vs0Sk_8NABqRg6ZGJEidR-icifeg2DOBILIYc9lHVSR1e2npoSuIpFO57yRh2yC/pub?gid=550578481&single=true&output=csv';
const input=document.getElementById('nameInput'),phoneInput=document.getElementById('phoneInput'),btn=document.getElementById('searchBtn'),resultsEl=document.getElementById('results'),statusEl=document.getElementById('statusText');let cache=null;
phoneInput.addEventListener('input',()=>{phoneInput.value=phoneInput.value.replace(/\D/g,'').slice(0,4)});
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function parseCount(v){const t=String(v??'').replace(/,/g,'').trim();if(!t)return null;const n=Number(t);return Number.isFinite(n)?n:null}
function formatCount(v){if(!Number.isFinite(v))return'-';return Number.isInteger(v)?String(v):String(Number(v.toFixed(2)))}
async function loadData(){if(cache)return cache;statusEl.textContent='불러오는 중...';try{const r=await fetch(`${CSV_URL}&v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const p=Papa.parse(await r.text(),{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});if(p.errors.length&&!p.data.length)throw new Error('CSV parse failed');cache=p.data;statusEl.textContent='';return cache}catch(e){console.error(e);statusEl.textContent='데이터를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';return[]}}
function renderEmpty(m){resultsEl.innerHTML=`<div class="empty">${m}</div>`}
function createDots(total,remain,confirmed){if(!confirmed||total===null||remain===null||total<=0||remain<0)return'';const used=Math.max(0,Math.min(total,total-remain)),count=Math.min(Math.ceil(total),32);let out='';for(let i=0;i<count;i++){const c=used-i,s=c>=1?'used':c>0?'half':'';out+=`<span class="dot ${s}" aria-hidden="true"></span>`}return out}
function renderResults(list){resultsEl.innerHTML='';if(!list.length){renderEmpty('일치하는 학생을 찾을 수 없어요.<br>이름을 다시 확인해주세요.');return}list.forEach(row=>{const total=parseCount(row['등록횟수']),remain=parseCount(row['잔여']),countStatus=String(row['회차상태']||'').trim(),confirmed=countStatus==='확정',needsReview=countStatus==='확인 필요',isWarn=confirmed&&remain!==null&&remain<=2,reviewMessage=String(row['안내']||'운영팀이 최근 수업기록을 확인하고 있습니다.').trim();let heroValue=remain===null?'-':formatCount(remain),heroLabel='회 남음',heroClass=isWarn?'warn':'ok';if(needsReview){heroValue='확인 중';heroLabel='';heroClass='review'}let badge='<span class="badge legacy">기존 계산</span>';if(confirmed)badge=isWarn?'<span class="badge warn">재등록 안내 대상 · 확정</span>':'<span class="badge ok">확정</span>';else if(needsReview)badge='<span class="badge review">회차 확인 필요</span>';const dots=createDots(total,remain,confirmed),card=document.createElement('div');card.className=`card${needsReview?' review':''}`;card.innerHTML=`<div class="card-top"><div class="card-name">${escapeHtml(row['학생명']||'-')}</div><div class="card-date">최근등록 ${escapeHtml(row['최근등록일']||'-')}</div></div><div class="hero-row"><div class="hero-num ${heroClass}">${escapeHtml(heroValue)}</div><div class="hero-label">${escapeHtml(heroLabel)}</div></div>${dots?`<div class="punch-row">${dots}</div>`:''}<div class="meta-row"><span>등록 <b>${total===null?'-':escapeHtml(formatCount(total))}회</b></span><span>${badge}</span></div>${needsReview?`<div class="review-note">${escapeHtml(reviewMessage)}</div>`:''}`;resultsEl.appendChild(card)})}
async function doSearch(){const q=input.value.trim(),pq=phoneInput.value.trim();if(!q){renderEmpty('이름을 입력하고 조회를 눌러주세요.');return}const data=await loadData();let matches=data.filter(r=>String(r['학생명']||'').includes(q));if(pq.length===4){const exact=matches.filter(r=>String(r['전화번호']||'').replace(/\D/g,'').slice(-4)===pq);if(!exact.length){renderEmpty('이름과 전화번호 뒷4자리가 일치하는 학생을 찾을 수 없어요.<br>입력한 정보를 다시 확인해주세요.');return}matches=exact;statusEl.textContent=''}else if(matches.length>1){statusEl.textContent=`동명이인 ${matches.length}명이 검색됐어요. 정확한 조회를 원하시면 전화번호 뒷4자리도 입력해주세요.`}else statusEl.textContent='';renderResults(matches)}
btn.addEventListener('click',doSearch);input.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});phoneInput.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});renderEmpty('학생 이름을 입력하면 잔여 수업회차를 바로 확인할 수 있어요.');
</script>
</body>
</html>
