<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라이언멤버스 | 수업회차 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEBE6;--surface:#FBFAF8;--ink:#545454;--strong:#2E2E2E;--deep:#7E9598;--warn:#B15E52;--ok:#6B8F71;--review:#9A6A30;--line:#DBD9D2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--strong);display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px}.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}.brand-mark{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.4em;color:var(--deep);margin-bottom:4px}.brand-title{font-size:20px;font-weight:900}.search-wrap,.status,.results{width:100%;max-width:420px}.search-box,.phone-row{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px}.search-box input,.phone-row input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--strong);outline:0}.search-box input{padding:14px 16px}.search-box button{border:0;background:var(--strong);color:#fff;padding:0 22px;border-radius:10px;font:700 15px 'Noto Sans KR',sans-serif;cursor:pointer}.phone-row{align-items:center;gap:8px;padding-left:16px;margin-top:8px}.phone-row span{font-size:13px;color:var(--ink);white-space:nowrap}.phone-row input{padding:12px 8px}.status{text-align:center;font-size:13px;color:var(--ink);margin-top:10px;min-height:18px}.results{margin-top:22px;display:flex;flex-direction:column;gap:14px}.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px}.card.review{border-color:#D7C5AD}.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}.card-name{font-size:19px;font-weight:900}.card-date{font-size:12px;color:var(--ink);text-align:right}.hero-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}.hero-num{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:.85}.hero-num.review,.hero-num.graduate,.hero-num.prepay{font-family:'Noto Sans KR',sans-serif;font-size:27px;line-height:1.2;font-weight:900}.hero-num.review,.hero-num.prepay{color:var(--review)}.hero-num.graduate{color:var(--strong)}.hero-label{font-size:13px;font-weight:700;color:var(--ink);padding-bottom:8px}.punch-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--deep)}.dot.used{background:var(--deep)}.dot.half{background:linear-gradient(to right,var(--deep) 50%,transparent 50%)}.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}.meta-row+.meta-row{margin-top:10px}.meta-row b{color:var(--strong)}.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}.badge.warn{background:#F3E4E1;color:var(--warn)}.badge.ok{background:#E4EAE5;color:var(--ok)}.badge.review{background:#F1E7D9;color:var(--review)}.badge.graduate{background:#E8E7E2;color:var(--ink)}.note{margin-top:12px;padding:11px 12px;border-radius:10px;background:#F7F0E7;color:#71502A;font-size:12.5px;line-height:1.55}.graduate-note{background:#F0EFEB;color:var(--ink)}.detail-btn{width:100%;margin-top:14px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;font:700 12.5px 'Noto Sans KR',sans-serif;color:var(--strong);cursor:pointer}.detail-btn:disabled{opacity:.55;cursor:default}.detail{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:6px}.detail.open{display:block}.detail-row{display:grid;grid-template-columns:78px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #ECEAE5;font-size:12px;align-items:start}.detail-date{font-weight:700}.detail-main{line-height:1.5}.detail-sub{color:var(--ink);font-size:11px}.detail-unit{font-weight:700;white-space:nowrap}.detail-empty{font-size:12px;color:var(--ink);padding:12px 0}.empty{max-width:420px;text-align:center;color:var(--ink);font-size:13.5px;line-height:1.7;margin-top:30px}footer{margin-top:auto;padding-top:44px;font-size:11px;color:#A6A39A;text-align:center}
</style>
</head>
<body>
<div class="brand"><div class="brand-mark">RYAN MEMBERS</div><div class="brand-title">수업회차 조회</div></div>
<div class="search-wrap">
<div class="search-box"><input id="nameInput" placeholder="학생 이름을 입력하세요" autocomplete="off"><button id="searchBtn">조회</button></div>
<div class="phone-row"><span>전화번호 뒷4자리</span><input id="phoneInput" type="tel" inputmode="numeric" maxlength="4" placeholder="동명이인일 때만 입력"></div>
<div class="status" id="statusText"></div>
</div>
<div class="results" id="results"></div>
<footer>ⓒ Ryan Members · 데이터는 매일 갱신됩니다</footer>
<script>
const ATT_API='https://script.google.com/macros/s/AKfycbyYZJFzIq5pLRnwEthn3oecpRrgr6JxkibZxNmuIZKgv7q0Na6aedVjegg9KUnFqsURiQ/exec';
const input=document.getElementById('nameInput'),phoneInput=document.getElementById('phoneInput'),btn=document.getElementById('searchBtn'),resultsEl=document.getElementById('results'),statusEl=document.getElementById('statusText');
phoneInput.addEventListener('input',()=>phoneInput.value=phoneInput.value.replace(/\D/g,'').slice(0,4));
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function num(v){const t=String(v??'').replace(/,/g,'').trim();if(!t)return null;const n=Number(t);return Number.isFinite(n)?n:null}
function fmt(v){return Number.isInteger(v)?String(v):String(Number(v.toFixed(2)))}
function pick(row,keys){for(const k of keys){const v=String(row[k]??'').trim();if(v!=='')return v}return''}
async function apiGet(params,timeoutMs=8000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);try{params.set('v',String(Date.now()));const r=await fetch(`${ATT_API}?${params.toString()}`,{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('HTTP');const data=await r.json();if(!data.ok){const err=new Error(data.error||'API_ERROR');err.code=data.error||'API_ERROR';err.reason=data.reason||'';err.detail=data.detail||'';throw err}return data}finally{clearTimeout(timer)}}
async function loadSummaryApi(name,phone4){const params=new URLSearchParams({action:'summary',name:name});if(phone4)params.set('phone4',phone4);const data=await apiGet(params,8000);return Array.isArray(data.rows)?data.rows:[]}
async function loadAttendanceApi(name,phone4){const params=new URLSearchParams({action:'attendance',name:name});if(phone4)params.set('phone4',phone4);const data=await apiGet(params,12000);return Array.isArray(data.attendance)?data.attendance:[]}
function renderEmpty(m){resultsEl.innerHTML=`<div class="empty">${m}</div>`}
function dots(total,remain,confirmed){if(!confirmed||total===null||remain===null||total<=0||remain<0)return'';const used=Math.max(0,Math.min(total,total-remain)),count=Math.min(Math.ceil(total),32);let out='';for(let i=0;i<count;i++){const c=used-i,s=c>=1?'used':c>0?'half':'';out+=`<span class="dot ${s}"></span>`}return out}
function attendanceHtml(rows){if(!rows.length)return'<div class="detail-empty">표시할 출결기록이 없습니다.</div>';return rows.map(r=>{const d=pick(r,['lessonDate']);const teacher=pick(r,['teacher'])||'-';const type=pick(r,['classType']);const unit=pick(r,['chargeUnits']);const counter=pick(r,['counter']);const status=pick(r,['status']);const sub=[type,counter,status].filter(Boolean).join(' · ');return`<div class="detail-row"><div class="detail-date">${esc(d||'-')}</div><div class="detail-main"><b>${esc(teacher)}</b>${sub?`<div class="detail-sub">${esc(sub)}</div>`:''}</div><div class="detail-unit">${unit!==''?esc(unit)+'회':''}</div></div>`}).join('')}
async function toggleDetail(detailBtn,row){const box=detailBtn.nextElementSibling;if(box.classList.contains('open')){box.classList.remove('open');detailBtn.textContent='상세보기 · 전체 출결기록';return}const phone=phoneInput.value.trim();detailBtn.disabled=true;detailBtn.textContent='출결 불러오는 중...';try{const rows=await loadAttendanceApi(String(row['학생명']||'').trim(),phone);box.innerHTML=attendanceHtml(rows);box.classList.add('open');detailBtn.textContent='상세보기 닫기'}catch(e){let msg='출결기록을 불러오지 못했습니다.';if(e.name==='AbortError')msg='조회가 12초를 넘겨 중단했습니다. 운영팀에 알려주세요.';else if(e.code==='PHONE_MISMATCH')msg='전화번호 뒷4자리가 일치하지 않습니다.';else if(e.code==='STUDENT_NOT_FOUND')msg='학생 정보를 찾을 수 없습니다.';else if(e.code==='IDENTITY_AMBIGUOUS')msg='학생 식별 정보가 중복되어 운영팀 확인이 필요합니다.';else if(e.code==='PHONE4_REQUIRED'){msg='동명이인입니다. 위에 전화번호 뒷4자리를 입력한 뒤 다시 눌러주세요.';phoneInput.focus()}else if(e.code==='SERVER_ERROR')msg='서버 조회 중 오류가 발생했습니다.';box.innerHTML=`<div class="detail-empty">${esc(msg)}</div>`;box.classList.add('open');detailBtn.textContent='다시 시도'}finally{detailBtn.disabled=false}}
function renderResults(list){resultsEl.innerHTML='';if(!list.length){renderEmpty('일치하는 학생을 찾을 수 없어요.<br>이름을 다시 확인해주세요.');return}
list.forEach(row=>{const status=String(row['회차상태']||'').trim();const graduated=status==='졸업'||String(row['졸업여부']||'').trim()==='졸업';const card=document.createElement('div');
if(graduated){card.className='card';card.innerHTML=`<div class="card-top"><div class="card-name">${esc(row['학생명']||'-')}</div></div><div class="hero-row"><div class="hero-num graduate">수강 종료</div></div><div class="meta-row"><span>현재 상태</span><span class="badge graduate">수강 종료</span></div><div class="note graduate-note">현재 수강이 종료된 학생입니다.<br>재등록하신 경우 운영팀에 문의해주세요.</div>`;resultsEl.appendChild(card);return}
const total=num(row['등록횟수']),remain=num(row['잔여']),prepay=num(row['미납선수업']),confirmed=status==='확정',review=status==='확인 필요',warn=confirmed&&remain!==null&&remain<=2,lastLesson=String(row['마지막수업일']||'').trim()||'-',msg=String(row['안내']||'운영팀이 최근 수업기록을 확인하고 있습니다.').trim();let hero=remain===null?'-':fmt(remain),label='회 남음',klass=warn?'warn':'ok';if(prepay!==null&&prepay>0){hero='결제 확인 중';label='';klass='prepay'}else if(review){hero='확인 중';label='';klass='review'}let badge=confirmed?(warn?'<span class="badge warn">재등록 안내 대상 · 확정</span>':'<span class="badge ok">확정</span>'):'<span class="badge review">회차 확인 필요</span>';const ds=dots(total,remain,confirmed);const note=prepay!==null&&prepay>0?`결제 전 초과 수업 <b>${esc(fmt(prepay))}회</b><br>결제 확인 후 정상 잔여회차가 표시됩니다.`:esc(msg);card.className=`card${review?' review':''}`;card.innerHTML=`<div class="card-top"><div class="card-name">${esc(row['학생명']||'-')}</div><div class="card-date">최근등록 ${esc(row['최근등록일']||'-')}</div></div><div class="hero-row"><div class="hero-num ${klass}">${esc(hero)}</div><div class="hero-label">${esc(label)}</div></div>${ds?`<div class="punch-row">${ds}</div>`:''}<div class="meta-row"><span>등록 <b>${total===null?'-':esc(fmt(total))}회</b></span><span>${badge}</span></div><div class="meta-row"><span>마지막 수업일</span><b>${esc(lastLesson)}</b></div>${review||prepay>0?`<div class="note">${note}</div>`:''}<button class="detail-btn" type="button">상세보기 · 전체 출결기록</button><div class="detail"></div>`;const detailBtn=card.querySelector('.detail-btn');detailBtn.addEventListener('click',()=>toggleDetail(detailBtn,row));resultsEl.appendChild(card)})}
async function doSearch(){const q=input.value.trim(),pq=phoneInput.value.trim();if(!q){renderEmpty('이름을 입력하고 조회를 눌러주세요.');return}btn.disabled=true;statusEl.textContent='조회 중...';try{const matches=await loadSummaryApi(q,pq);statusEl.textContent=matches.length>1&&pq.length!==4?`동명이인 ${matches.length}명이 검색됐어요. 정확한 조회를 위해 전화번호 뒷4자리를 입력해주세요.`:'';renderResults(matches)}catch(e){if(e.name==='AbortError')statusEl.textContent='조회가 8초를 넘겨 중단됐습니다. 다시 시도해주세요.';else statusEl.textContent='회차 데이터를 불러오지 못했습니다. 다시 시도해주세요.';renderEmpty('조회 중 오류가 발생했습니다.')}finally{btn.disabled=false}}
btn.addEventListener('click',doSearch);input.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});phoneInput.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});renderEmpty('학생 이름을 입력하면 잔여 수업회차를 바로 확인할 수 있어요.');
</script>
</body>
</html>
